<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古詩詞逐句朗讀 — 曹操〈短歌行〉・蘇軾〈水調歌頭〉・唐詩三百首</title>
<style>
  :root {
    --bg-outer: #ece4d5;
    --bg-paper: #fbf8f1;
    --bg-card: #ffffff;
    --bg-active: #fff4df;
    --bg-hover: #f6f0e4;
    --text-main: #26221e;
    --text-muted: #6e655c;
    --text-note: #524a42;
    --accent: #b83b2b;       /* 硃砂紅 */
    --accent-dark: #8f291c;
    --accent-soft: #f9e6e3;
    --gold: #d4881c;
    --border: #e2d8c5;
    --shadow: 0 10px 32px rgb(45 35 20 / 0.10);
    --poem-size: 1.75rem;
    --rt-size: 0.72rem;
  }

  [data-theme="dark"] {
    --bg-outer: #161514;
    --bg-paper: #211f1c;
    --bg-card: #2b2824;
    --bg-active: #3c3122;
    --bg-hover: #322e29;
    --text-main: #efeae1;
    --text-muted: #a89f93;
    --text-note: #cfc6ba;
    --accent: #e05a47;
    --accent-dark: #b83b2b;
    --accent-soft: #422622;
    --gold: #f0a83c;
    --border: #3d3831;
    --shadow: 0 10px 32px rgb(0 0 0 / 0.45);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(circle at top, var(--bg-paper), var(--bg-outer));
    color: var(--text-main);
    font-family: "Iansui", "Kaiti TC", "STKaiti", "DFKai-SB", "BiauKai", "Noto Serif TC", "PMingLiU", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 160px;
    transition: background 0.3s, color 0.3s;
  }

  .window-wrapper {
    width: min(960px, 100%);
    background: var(--bg-paper);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 22px 26px 32px;
    position: relative;
  }

  .window-wrapper.fullscreen {
    width: 100vw !important;
    height: 100vh !important;
    max-width: none;
    position: fixed;
    top: 0;
    left: 0;
    border-radius: 0;
    border: none;
    overflow-y: auto;
    padding-bottom: 165px;
    z-index: 900;
  }

  /* 頂部導覽與工具列 */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: var(--accent);
    color: #fff;
    font-family: "DFKai-SB", "BiauKai", serif;
    font-weight: bold;
    font-size: 1.05rem;
    border-radius: 6px;
    border: 2px solid #fff3;
    box-shadow: 0 2px 6px rgb(184 59 43 / 0.35);
    user-select: none;
  }

  .brand-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .top-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .select-box, .tool-btn {
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    font-size: 0.9rem;
    padding: 7px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.18s;
  }

  .select-box {
    font-weight: 600;
    max-width: 240px;
  }

  .tool-btn:hover, .select-box:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }

  .tool-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .tool-btn.catalog-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  .tool-btn.catalog-btn:hover {
    background: var(--accent-dark);
  }

  /* 依作者分類選擇列 */
  .selector-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  }

  .selector-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .selector-label {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* 熱門詩人快速標籤列 */
  .author-chips-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  }

  .chip-label {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-right: 2px;
  }

  .author-chip {
    font-family: inherit;
    font-size: 0.82rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s;
  }

  .author-chip:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }

  .author-chip.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  .author-chip .count {
    font-size: 0.74rem;
    opacity: 0.82;
    margin-left: 2px;
  }

  /* 詩詞標題區 */
  .poem-header {
    text-align: center;
    margin: 10px 0 22px;
    position: relative;
  }

  .poem-title-row {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .poem-title {
    font-size: 2.25rem;
    margin: 0;
    letter-spacing: 5px;
    color: var(--text-main);
  }

  .speak-title-btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--accent);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
  }

  .speak-title-btn:hover {
    transform: scale(1.08);
    background: var(--accent-soft);
  }

  .poem-meta {
    margin-top: 8px;
    font-size: 1.12rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .genre-badge {
    font-family: "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    letter-spacing: 1px;
  }

  .poem-intro {
    max-width: 700px;
    margin: 12px auto 0;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text-muted);
    background: var(--bg-hover);
    padding: 10px 16px;
    border-radius: 12px;
    border-left: 4px solid var(--accent);
    text-align: left;
  }

  /* 朗讀進度與狀態提示橫幅 */
  .status-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    font-size: 0.92rem;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    background: var(--bg-hover);
    color: var(--text-muted);
  }

  .status-badge.playing {
    background: var(--accent);
    color: #fff;
  }

  .status-badge.shadowing {
    background: var(--gold);
    color: #fff;
  }

  .progress-track {
    flex: 1;
    min-width: 120px;
    max-width: 240px;
    height: 8px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width 0.3s ease;
  }

  /* 詩句列表 */
  .sentences-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sentence-card {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.22s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sentence-card:hover {
    border-color: var(--gold);
    background: var(--bg-hover);
    transform: translateY(-1px);
  }

  .sentence-card.active {
    background: var(--bg-active);
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgb(184 59 43 / 0.14);
  }

  .sentence-card.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 5px;
    background: var(--accent);
    border-radius: 0 4px 4px 0;
  }

  .sentence-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .sentence-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .sentence-index {
    font-family: "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--bg-hover);
    border: 1px solid var(--border);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sentence-card.active .sentence-index {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .sentence-text {
    font-size: var(--poem-size);
    line-height: 2.15;
    letter-spacing: 3px;
    font-weight: 500;
  }

  /* 注音 Ruby 樣式 */
  ruby {
    ruby-align: center;
    margin: 0 1px;
  }

  rt {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    font-size: var(--rt-size);
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0;
    transform: translateY(-2px);
  }

  .hide-zhuyin rt {
    display: none;
  }

  .hide-zhuyin .sentence-text {
    line-height: 1.65;
  }

  .sentence-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .line-play-btn {
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--text-main);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .line-play-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .sentence-card.active .line-play-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 音波動畫 */
  .wave-indicator {
    display: none;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
    padding: 0 6px;
  }

  .sentence-card.playing .wave-indicator {
    display: inline-flex;
  }

  .wave-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: waveBounce 0.7s infinite ease-in-out;
  }
  .wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { height: 9px; animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { height: 15px; animation-delay: 0.45s; }

  @keyframes waveBounce {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1.1); }
  }

  /* 註釋與白話翻譯區 */
  .sentence-details {
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
    margin-top: 2px;
    padding-left: 44px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.94rem;
    line-height: 1.55;
  }

  .hide-notes .sentence-details {
    display: none;
  }

  .trans-line {
    color: var(--text-note);
  }

  .trans-tag, .vocab-tag {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 6px;
  }

  .trans-tag {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .vocab-line {
    color: var(--text-muted);
    font-size: 0.86rem;
  }

  .vocab-tag {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  /* 底部懸浮朗讀控制列 */
  .player-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, calc(100% - 24px));
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 12px 36px rgb(0 0 0 / 0.22);
    padding: 12px 18px;
    z-index: 950;
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dock-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .now-playing {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    flex: 1;
  }

  .now-playing-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .now-playing-text {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .transport-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ctrl-btn {
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--text-main);
    border-radius: 12px;
    padding: 8px 13px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }

  .ctrl-btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    padding: 9px 20px;
    font-size: 1.02rem;
    box-shadow: 0 4px 12px rgb(184 59 43 / 0.3);
  }

  .ctrl-btn.primary:hover {
    background: var(--accent-dark);
  }

  .dock-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .setting-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .setting-group label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
  }

  .mini-select {
    font-family: inherit;
    font-size: 0.84rem;
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--text-main);
    cursor: pointer;
  }

  /* 彈出視窗共用樣式 */
  dialog {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg-paper);
    color: var(--text-main);
    padding: 22px;
    box-shadow: var(--shadow);
    font-family: "Microsoft JhengHei", system-ui, sans-serif;
  }

  dialog::backdrop {
    background: rgb(0 0 0 / 0.48);
    backdrop-filter: blur(2px);
  }

  #customPoemDialog {
    width: min(540px, 92vw);
  }

  /* 唐詩三百首 依作者分類總覽 Dialog */
  #catalogDialog {
    width: min(920px, 95vw);
    max-height: 86vh;
    padding: 0;
    overflow: hidden;
  }

  .catalog-container {
    display: flex;
    flex-direction: column;
    height: min(78vh, 720px);
  }

  .catalog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    flex-wrap: wrap;
  }

  .catalog-header h2 {
    margin: 0;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .catalog-search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 380px;
  }

  .catalog-search {
    width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--text-main);
    font: inherit;
    font-size: 0.9rem;
  }

  .catalog-body {
    display: grid;
    grid-template-columns: 230px 1fr;
    flex: 1;
    overflow: hidden;
  }

  .catalog-authors {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px;
    background: var(--bg-paper);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .author-nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-main);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }

  .author-nav-item:hover {
    background: var(--bg-hover);
  }

  .author-nav-item.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .author-nav-count {
    font-size: 0.76rem;
    padding: 2px 7px;
    border-radius: 99px;
    background: var(--bg-hover);
    color: var(--text-muted);
  }

  .author-nav-item.active .author-nav-count {
    background: rgb(255 255 255 / 0.22);
    color: #fff;
  }

  .catalog-poems {
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    align-content: start;
  }

  .poem-grid-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.16s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }

  .poem-grid-card:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
    transform: translateY(-2px);
  }

  .poem-grid-card.current {
    border-color: var(--accent);
    background: var(--bg-active);
  }

  .poem-grid-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .poem-grid-title {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text-main);
  }

  .poem-grid-author {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }

        }
        startIdx = text.indexOf(phrase, startIdx + 1);
      }
    }

    // 再補齊單字注音
    const punctRegex = /[，。！？；：、「」『』（）《》〈〉—…\s]/;
    return chars.map((ch, i) => {
      if (punctRegex.test(ch)) return [ch, ''];
      return [ch, zys[i] || CHAR_ZHUYIN[ch] || ''];
    });
  }

  // 合併《精選名篇》與《唐詩三百首》(320首)
  const TANG_RAW = (window.TANG300_DATA && window.TANG300_DATA.poems) || [];
  const TANG_POEMS = TANG_RAW.map(p => ({
    id: p.id,
    title: p.title,
    author: p.author,
    poet: p.poet,
    category: 'tang300',
    genre: `唐詩三百首・${p.genre}`,
    ttsHeader: `${p.title.replace(/（.*）/, '')}，唐，${p.poet}。`,
    intro: `收錄於《唐詩三百首》【${p.genre}】，作者為唐代詩人${p.poet}。點擊任一詩句即可逐句朗讀。`,
    lines: p.lines.map(l => ({
      text: l.text,
      tts: l.text,
      ruby: annotateTextToRuby(l.text),
      trans: l.trans || '',
      vocab: l.vocab || ''
    }))
  }));

  const POEMS = [...FEATURED_POEMS, ...TANG_POEMS];

  // 統計《唐詩三百首》各詩人作品數量並排序
  function getSortedTangAuthors() {
    const counts = new Map();
    TANG_POEMS.forEach(p => {
      counts.set(p.poet, (counts.get(p.poet) || 0) + 1);
    });
    return Array.from(counts.entries())
      .map(([poet, count]) => ({ poet, count }))
      .sort((a, b) => b.count - a.count || a.poet.localeCompare(b.poet, 'zh-Hant'));
  }

  // 狀態管理
  const state = {
    selectedCategory: 'featured', // 'featured' | 'all_tang' | poetName | 'custom'
    currentPoemIdx: 0,
    activeIndex: 0,
    isPlaying: false,
    unitMode: 'sentence', // 'sentence' | 'clause'
    playMode: 'continuous', // 'continuous' | 'shadow' | 'twice' | 'loop-one' | 'single'
    rate: 0.9,
    pauseMs: 800,
    engine: 'google',
    showZhuyin: true,
    showNotes: true,
    fontScaleIndex: 1,
    repeatCounter: 0,
    timerId: null,
    currentAudio: null,
    playToken: 0,
    catalogAuthor: 'all_tang',
    catalogSearch: ''
  };

  const fontScales = [
    { poem: '1.45rem', rt: '0.66rem' },
    { poem: '1.75rem', rt: '0.72rem' },
    { poem: '2.10rem', rt: '0.82rem' },
    { poem: '2.45rem', rt: '0.92rem' }
  ];

  const $ = id => document.getElementById(id);

  // 根據目前選擇的「詩人／分類」篩選對應詩作索引
  function getFilteredPoemIndices(categoryKey = state.selectedCategory) {
    const indices = [];
    POEMS.forEach((p, idx) => {
      if (categoryKey === 'featured' && p.category === 'featured') {
        indices.push(idx);
      } else if (categoryKey === 'all_tang' && p.category === 'tang300') {
        indices.push(idx);
      } else if (categoryKey === 'custom' && p.category === 'custom') {
        indices.push(idx);
      } else if (p.poet === categoryKey) {
        indices.push(idx);
      }
    });
    return indices;
  }

  // 渲染「詩人／分類」下拉選單與熱門詩人快速標籤列
  function renderAuthorSelectors() {
    const tangAuthors = getSortedTangAuthors();
    const hasCustom = POEMS.some(p => p.category === 'custom');

    const authorSel = $('authorSelect');
    let html = `
      <option value="featured">⭐ 精選名篇（曹操〈短歌行〉・蘇軾〈水調歌頭〉）</option>
      <option value="all_tang">📚 唐詩三百首 — 全部詩人 (${tangAuthors.length}位・${TANG_POEMS.length}首)</option>
    `;
    if (hasCustom) {
      html += `<option value="custom">✨ 自訂詩詞</option>`;
    }
    html += `<optgroup label="── 唐詩三百首・依作者分類（共 ${tangAuthors.length} 位詩人）──">`;
    tangAuthors.forEach(a => {
      html += `<option value="${escapeHTML(a.poet)}">${escapeHTML(a.poet)}（${a.count} 首）</option>`;
    });
    html += `</optgroup>`;
    authorSel.innerHTML = html;
    authorSel.value = state.selectedCategory;

    // 渲染熱門詩人快速切換 Chip 列
    const topPoets = tangAuthors.slice(0, 10);
    const chipsBar = $('authorChipsBar');
    let chipsHTML = `<span class="chip-label">快速分類：</span>`;
    chipsHTML += `<button type="button" class="author-chip ${state.selectedCategory === 'featured' ? 'active' : ''}" data-cat="featured">⭐ 曹操・蘇軾精選<span class="count">(${FEATURED_POEMS.length})</span></button>`;
    topPoets.forEach(a => {
      const isAct = state.selectedCategory === a.poet;
      chipsHTML += `<button type="button" class="author-chip ${isAct ? 'active' : ''}" data-cat="${escapeHTML(a.poet)}">${escapeHTML(a.poet)}<span class="count">(${a.count})</span></button>`;
    });
    chipsHTML += `<button type="button" class="author-chip" id="moreAuthorsChip">更多詩人 (${tangAuthors.length}) ▾</button>`;
    chipsBar.innerHTML = chipsHTML;
  }

  // 渲染第二層「詩詞作品」下拉選單
  function renderPoemSelect() {
    const indices = getFilteredPoemIndices(state.selectedCategory);
    const sel = $('poemSelect');
    sel.innerHTML = indices.map((poemIdx, order) => {
      const p = POEMS[poemIdx];
      const shortGenre = p.genre ? p.genre.replace('唐詩三百首・', '') : '';
      const authorSuffix = (state.selectedCategory === 'featured' || state.selectedCategory === 'all_tang')
        ? ` — ${p.poet}`
        : '';
      return `<option value="${poemIdx}" ${poemIdx === state.currentPoemIdx ? 'selected' : ''}>${order + 1}. ${escapeHTML(p.title)}${authorSuffix}${shortGenre ? ` 〔${escapeHTML(shortGenre)}〕` : ''}</option>`;
    }).join('');
  }

  // 取得目前詩詞在目前分句單位下的「朗讀項目陣列」
  function getActiveUnits() {
    const poem = POEMS[state.currentPoemIdx];
    if (state.unitMode === 'sentence') {
      return poem.lines.map((line, idx) => ({
        index: idx,
        text: line.text,
        tts: line.tts || line.text,
        ruby: line.ruby || null,
        trans: line.trans || '',
        vocab: line.vocab || ''
      }));
    } else {
      const units = [];
      poem.lines.forEach((line) => {
        if (line.ruby && line.ruby.length > 0) {
          let chunkChars = [];
          let chunkText = '';
          line.ruby.forEach(([ch, zy]) => {
            chunkChars.push([ch, zy]);
            chunkText += ch;
            if ('，；？！。'.includes(ch)) {
              units.push({
                index: units.length,
                text: chunkText.trim(),
                tts: chunkText.replace(/讌/g, '宴').trim(),
                ruby: chunkChars,
                trans: line.trans || '',
                vocab: line.vocab || ''
              });
              chunkChars = [];
              chunkText = '';
            }
          });
          if (chunkText.trim()) {
            units.push({
              index: units.length,
              text: chunkText.trim(),
              tts: chunkText.replace(/讌/g, '宴').trim(),
              ruby: chunkChars,
              trans: line.trans || '',
              vocab: line.vocab || ''
            });
          }
        } else {
          const parts = line.text.split(/(?<=[，；？！。])/);
          parts.forEach(p => {
            if (p.trim()) {
              units.push({
                index: units.length,
                text: p.trim(),
                tts: p.trim(),
                ruby: null,
                trans: line.trans || '',
                vocab: line.vocab || ''
              });
            }
          });
        }
      });
      return units;
    }
  }

  function renderRubyHTML(unit) {
    if (!unit.ruby || unit.ruby.length === 0) {
      return `<span>${escapeHTML(unit.text)}</span>`;
    }
    return unit.ruby.map(([ch, zy]) => {
      if (!zy) return `<span class="punct">${escapeHTML(ch)}</span>`;
      return `<ruby>${escapeHTML(ch)}<rt>${escapeHTML(zy)}</rt></ruby>`;
    }).join('');
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 渲染整首詩的卡片列表
  function renderPoem() {
    const poem = POEMS[state.currentPoemIdx];
    $('poemTitle').textContent = poem.title;
    $('poemAuthor').textContent = poem.author;
    $('poemGenre').textContent = poem.genre || '古典詩詞';
    $('poemIntro').textContent = poem.intro || '點擊下方任一詩句即可開始逐句朗讀。';
    $('poemIntro').style.display = poem.intro ? 'block' : 'none';

    const units = getActiveUnits();
    if (state.activeIndex >= units.length) {
      state.activeIndex = 0;
    }

    const listEl = $('sentencesList');
    listEl.classList.toggle('hide-zhuyin', !state.showZhuyin);
    listEl.classList.toggle('hide-notes', !state.showNotes);

    listEl.innerHTML = units.map((u, idx) => {
      const hasDetails = u.trans || u.vocab;
      return `
        <article class="sentence-card ${idx === state.activeIndex ? 'active' : ''}" data-index="${idx}" role="button" tabindex="0" aria-label="第 ${idx + 1} 句：${escapeHTML(u.text)}">
          <div class="sentence-main">
            <div class="sentence-left">
              <span class="sentence-index">${idx + 1}</span>
              <div class="sentence-text">${renderRubyHTML(u)}</div>
            </div>
            <div class="sentence-actions">
              <div class="wave-indicator" aria-hidden="true">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
              </div>
              <button type="button" class="line-play-btn" data-play-index="${idx}" title="朗讀這一句">🔊</button>
            </div>
          </div>
          ${hasDetails ? `
            <div class="sentence-details">
              ${u.trans ? `<div class="trans-line"><span class="trans-tag">白話句意</span>${escapeHTML(u.trans)}</div>` : ''}
              ${u.vocab ? `<div class="vocab-line"><span class="vocab-tag">字詞註釋</span>${escapeHTML(u.vocab)}</div>` : ''}
            </div>
          ` : ''}
        </article>
      `;
    }).join('');

    updateUIState();
  }

  function updateUIState(statusText = null, badgeMode = '') {
    const units = getActiveUnits();
    const total = units.length;
    const current = units[state.activeIndex] || units[0];

    document.querySelectorAll('.sentence-card').forEach((card, idx) => {
      const isCurrent = idx === state.activeIndex;
      card.classList.toggle('active', isCurrent);
      card.classList.toggle('playing', isCurrent && state.isPlaying);
    });

    $('progressCounter').textContent = `第 ${state.activeIndex + 1} / ${total} 句`;
    const pct = total > 0 ? ((state.activeIndex + 1) / total) * 100 : 0;
    $('progressFill').style.width = `${pct}%`;

    $('dockIndexLabel').textContent = `第 ${state.activeIndex + 1} 句`;
    $('dockCurrentText').textContent = current ? current.text : '';

    const playBtn = $('playPauseBtn');
    if (state.isPlaying) {
      playBtn.innerHTML = '⏸ 暫停朗讀';
    } else {
      playBtn.innerHTML = '▶ 逐句朗讀';
    }

    const badge = $('statusBadge');
    badge.className = 'status-badge';
    if (statusText) {
      badge.textContent = statusText;
      if (badgeMode) badge.classList.add(badgeMode);
    } else if (state.isPlaying) {
      badge.textContent = `🔊 正在朗讀第 ${state.activeIndex + 1} 句...`;
      badge.classList.add('playing');
    } else {
      badge.textContent = '⏹ 待命：點擊任一詩句或按「逐句朗讀」';
    }
  }

  function scrollActiveIntoView() {
    const card = document.querySelector(`.sentence-card[data-index="${state.activeIndex}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function stopAudioOnly() {
    state.playToken++;
    if (state.timerId) {
      clearTimeout(state.timerId);
      state.timerId = null;
    }
    if (state.currentAudio) {
      state.currentAudio.onended = null;
      state.currentAudio.onerror = null;
      state.currentAudio.pause();
      state.currentAudio = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  function stopPlayback() {
    stopAudioOnly();
    state.isPlaying = false;
    state.repeatCounter = 0;
    updateUIState('⏹ 已停止朗讀');
  }

  function speakText(text, onComplete) {
    const token = ++state.playToken;

    const finishIfCurrent = () => {
      if (token !== state.playToken) return;
      if (onComplete) onComplete();
    };

    const speakWithWebSpeech = () => {
      if (token !== state.playToken) return;
      if (!('speechSynthesis' in window)) {
        finishIfCurrent();
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW';
      u.rate = state.rate;

      const voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('zh'));
      const twVoice = voices.find(v =>
        v.lang === 'zh-TW' && (v.name.includes('Hanhan') || v.name.includes('Yating') || v.name.includes('Mei-Jia') || v.name.includes('曉') || v.name.includes('Google'))
      ) || voices.find(v => v.lang === 'zh-TW') || voices[0];

      if (twVoice) u.voice = twVoice;
      u.onend = finishIfCurrent;
      u.onerror = finishIfCurrent;
      window.speechSynthesis.speak(u);
    };

    if (state.engine === 'webspeech') {
      speakWithWebSpeech();
      return;
    }

    const url = `https://translate.googleapis.com/translate_tts?client=tw-ob&ie=UTF-8&tl=zh-TW&q=${encodeURIComponent(text)}`;
    const audio = new Audio();
    audio.referrerPolicy = 'no-referrer';
    audio.src = url;
    audio.playbackRate = state.rate;
    state.currentAudio = audio;

    audio.onended = finishIfCurrent;
    audio.onerror = () => {
      speakWithWebSpeech();
    };

    audio.play().catch(() => {
      speakWithWebSpeech();
    });
  }

  function playCurrentUnit(forceSingle = false) {
    stopAudioOnly();
    const units = getActiveUnits();
    if (!units.length) return;

    if (state.activeIndex < 0) state.activeIndex = 0;
    if (state.activeIndex >= units.length) state.activeIndex = units.length - 1;

    state.isPlaying = true;
    const unit = units[state.activeIndex];
    const tokenAtStart = state.playToken + 1;

    scrollActiveIntoView();
    const isSecondRead = state.playMode === 'twice' && state.repeatCounter === 1;
    updateUIState(
      isSecondRead
        ? `🔊 第 ${state.activeIndex + 1} 句（第 2 遍加深記憶）：${unit.text}`
        : `🔊 正在朗讀第 ${state.activeIndex + 1} 句：${unit.text}`,
      'playing'
    );

    speakText(unit.tts, () => {
      if (state.playToken !== tokenAtStart || !state.isPlaying) return;

      if (forceSingle || state.playMode === 'single') {
        state.isPlaying = false;
        state.repeatCounter = 0;
        updateUIState(`✔ 已讀完第 ${state.activeIndex + 1} 句`);
        return;
      }

      if (state.playMode === 'loop-one') {
        state.timerId = setTimeout(() => {
          if (state.isPlaying) playCurrentUnit();
        }, state.pauseMs);
        return;
      }

      if (state.playMode === 'twice' && state.repeatCounter === 0) {
        state.repeatCounter = 1;
        state.timerId = setTimeout(() => {
          if (state.isPlaying) playCurrentUnit();
        }, Math.max(500, state.pauseMs));
        return;
      }
      state.repeatCounter = 0;

      if (state.playMode === 'shadow') {
        const shadowTime = Math.max(2200, unit.text.length * 320);
        updateUIState(`🎤 請跟讀：「${unit.text}」`, 'shadowing');
        state.timerId = setTimeout(() => {
          if (!state.isPlaying) return;
          advanceToNextOrFinish();
        }, shadowTime);
        return;
      }

      state.timerId = setTimeout(() => {
        if (!state.isPlaying) return;
        advanceToNextOrFinish();
      }, state.pauseMs);
    });
  }

  function advanceToNextOrFinish() {
    const units = getActiveUnits();
    if (state.activeIndex < units.length - 1) {
      state.activeIndex++;
      playCurrentUnit();
    } else {
      state.isPlaying = false;
      updateUIState('🎉 全詩朗讀完畢！點擊「逐句朗讀」可從頭再讀一遍');
    }
  }

  function togglePlayPause() {
    if (state.isPlaying) {
      stopAudioOnly();
      state.isPlaying = false;
      updateUIState(`⏸ 已暫停於第 ${state.activeIndex + 1} 句`);
    } else {
      const units = getActiveUnits();
      if (state.activeIndex >= units.length - 1 && $('statusBadge').textContent.includes('完畢')) {
        state.activeIndex = 0;
      }
      playCurrentUnit(false);
    }
  }

  // 切換分類／作者
  function selectCategory(catKey, targetPoemIdx = null) {
    stopPlayback();
    state.selectedCategory = catKey;
    const indices = getFilteredPoemIndices(catKey);
    if (targetPoemIdx !== null && indices.includes(targetPoemIdx)) {
      state.currentPoemIdx = targetPoemIdx;
    } else if (indices.length > 0) {
      state.currentPoemIdx = indices[0];
    }
    state.activeIndex = 0;
    renderAuthorSelectors();
    renderPoemSelect();
    renderPoem();
  }

  // 渲染《唐詩三百首》依作者分類總覽目錄彈窗
  function renderCatalogModal() {
    const tangAuthors = getSortedTangAuthors();
    const authorsEl = $('catalogAuthorsList');
    const q = state.catalogSearch.trim();

    let navHTML = `
      <button type="button" class="author-nav-item ${state.catalogAuthor === 'featured' ? 'active' : ''}" data-cat-author="featured">
        <span>⭐ 精選名篇 (曹操/蘇軾)</span>
        <span class="author-nav-count">${FEATURED_POEMS.length}</span>
      </button>
      <button type="button" class="author-nav-item ${state.catalogAuthor === 'all_tang' ? 'active' : ''}" data-cat-author="all_tang">
        <span>📚 唐詩三百首 (全部)</span>
        <span class="author-nav-count">${TANG_POEMS.length}</span>
      </button>
    `;

    tangAuthors.forEach(a => {
      if (q && !a.poet.includes(q)) {
        // 若有搜尋字詞，仍顯示有匹配詩作的詩人
        const hasMatch = TANG_POEMS.some(p =>
          p.poet === a.poet && (p.title.includes(q) || p.poet.includes(q) || p.lines.some(l => l.text.includes(q)))
        );
        if (!hasMatch) return;
      }
      const isAct = state.catalogAuthor === a.poet;
      navHTML += `
        <button type="button" class="author-nav-item ${isAct ? 'active' : ''}" data-cat-author="${escapeHTML(a.poet)}">
          <span>${escapeHTML(a.poet)}</span>
          <span class="author-nav-count">${a.count} 首</span>
        </button>
      `;
    });
    authorsEl.innerHTML = navHTML;

    // 右側詩作卡片清單
    let candidateIndices = [];
    if (q) {
      // 有關鍵字時跨全庫或當前分類搜尋
      POEMS.forEach((p, idx) => {
        const matchAuthor = state.catalogAuthor === 'all_tang'
          ? true
          : (state.catalogAuthor === 'featured' ? p.category === 'featured' : p.poet === state.catalogAuthor);
        if (!matchAuthor) return;
        if (
          p.title.includes(q) ||
          p.poet.includes(q) ||
          (p.genre && p.genre.includes(q)) ||
          p.lines.some(l => l.text.includes(q))
        ) {
          candidateIndices.push(idx);
        }
      });
    } else {
      candidateIndices = getFilteredPoemIndices(state.catalogAuthor);
    }

    const gridEl = $('catalogPoemsGrid');
    if (candidateIndices.length === 0) {
      gridEl.innerHTML = `<div style="grid-column: 1/-1; padding: 28px; text-align:center; color: var(--text-muted);">找不到符合「${escapeHTML(q)}」的詩詞，請嘗試切換左側「📚 唐詩三百首 (全部)」或更換關鍵字。</div>`;
      return;
    }

    gridEl.innerHTML = candidateIndices.map(poemIdx => {
      const p = POEMS[poemIdx];
      const firstLine = p.lines[0] ? p.lines[0].text : '';
      const shortGenre = p.genre ? p.genre.replace('唐詩三百首・', '') : '';
      return `
        <button type="button" class="poem-grid-card ${poemIdx === state.currentPoemIdx ? 'current' : ''}" data-pick-poem="${poemIdx}">
          <div class="poem-grid-top">
            <span class="poem-grid-title">${escapeHTML(p.title)}</span>
            <span class="poem-grid-author">${escapeHTML(p.poet)} · ${escapeHTML(shortGenre)}</span>
          </div>
          <div class="poem-grid-preview">${escapeHTML(firstLine)}</div>
        </button>
      `;
    }).join('');
  }

  // 事件綁定
  $('authorSelect').addEventListener('change', e => {
    selectCategory(e.target.value);
  });

  $('poemSelect').addEventListener('change', e => {
    stopPlayback();
    state.currentPoemIdx = Number(e.target.value);
    state.activeIndex = 0;
    renderPoem();
  });

  $('authorChipsBar').addEventListener('click', e => {
    const moreBtn = e.target.closest('#moreAuthorsChip');
    if (moreBtn) {
      state.catalogAuthor = state.selectedCategory === 'featured' ? 'all_tang' : state.selectedCategory;
      renderCatalogModal();
      $('catalogDialog').showModal();
      return;
    }
    const chip = e.target.closest('.author-chip[data-cat]');
    if (chip) {
      selectCategory(chip.dataset.cat);
    }
  });

  // 目錄對話框事件
  const catalogDialog = $('catalogDialog');
  $('openCatalogBtn').addEventListener('click', () => {
    state.catalogAuthor = state.selectedCategory;
    renderCatalogModal();
    catalogDialog.showModal();
  });

  $('closeCatalogBtn').addEventListener('click', () => {
    catalogDialog.close();
  });

  $('catalogSearch').addEventListener('input', e => {
    state.catalogSearch = e.target.value;
    if (state.catalogSearch.trim() && state.catalogAuthor === 'featured') {
      state.catalogAuthor = 'all_tang';
    }
    renderCatalogModal();
  });

  $('catalogAuthorsList').addEventListener('click', e => {
    const btn = e.target.closest('.author-nav-item');
    if (!btn) return;
    state.catalogAuthor = btn.dataset.catAuthor;
    renderCatalogModal();
  });

  $('catalogPoemsGrid').addEventListener('click', e => {
    const card = e.target.closest('.poem-grid-card');
    if (!card) return;
    const poemIdx = Number(card.dataset.pickPoem);
    const picked = POEMS[poemIdx];
    const targetCat = picked.category === 'featured' ? 'featured' : (picked.poet || 'all_tang');
    selectCategory(targetCat, poemIdx);
    catalogDialog.close();
  });

  $('sentencesList').addEventListener('click', e => {
    const card = e.target.closest('.sentence-card');
    if (!card) return;
    const idx = Number(card.dataset.index);
    state.activeIndex = idx;
    state.repeatCounter = 0;
    playCurrentUnit(state.playMode === 'single');
  });

  $('sentencesList').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const card = e.target.closest('.sentence-card');
      if (card) {
        e.preventDefault();
        state.activeIndex = Number(card.dataset.index);
        state.repeatCounter = 0;
        playCurrentUnit(state.playMode === 'single');
      }
    }
  });

  $('speakHeaderBtn').addEventListener('click', () => {
    stopPlayback();
    const poem = POEMS[state.currentPoemIdx];
    const headerText = poem.ttsHeader || `${poem.title}，${poem.author}`;
    updateUIState(`🔊 朗讀詩題：${poem.title}`, 'playing');
    speakText(headerText, () => {
      updateUIState(`✔ 已朗讀詩題：${poem.title}`);
    });
  });

  $('playPauseBtn').addEventListener('click', togglePlayPause);

  $('prevBtn').addEventListener('click', () => {
    const units = getActiveUnits();
    state.activeIndex = (state.activeIndex - 1 + units.length) % units.length;
    state.repeatCounter = 0;
    playCurrentUnit(state.playMode === 'single');
  });

  $('nextBtn').addEventListener('click', () => {
    const units = getActiveUnits();
    state.activeIndex = (state.activeIndex + 1) % units.length;
    state.repeatCounter = 0;
    playCurrentUnit(state.playMode === 'single');
  });

  $('repeatOneBtn').addEventListener('click', () => {
    state.repeatCounter = 0;
    playCurrentUnit(true);
  });

  $('stopBtn').addEventListener('click', stopPlayback);

  $('modeSelect').addEventListener('change', e => {
    state.playMode = e.target.value;
    state.repeatCounter = 0;
  });

  $('unitSelect').addEventListener('change', e => {
    stopPlayback();
    state.unitMode = e.target.value;
    state.activeIndex = 0;
    renderPoem();
  });

  $('rateSelect').addEventListener('change', e => {
    state.rate = Number(e.target.value);
    if (state.currentAudio) {
      state.currentAudio.playbackRate = state.rate;
    }
  });

  $('pauseSelect').addEventListener('change', e => {
    state.pauseMs = Number(e.target.value);
  });

  $('engineSelect').addEventListener('change', e => {
    state.engine = e.target.value;
  });

  $('toggleZhuyinBtn').addEventListener('click', e => {
    state.showZhuyin = !state.showZhuyin;
    e.currentTarget.classList.toggle('active', state.showZhuyin);
    $('sentencesList').classList.toggle('hide-zhuyin', !state.showZhuyin);
  });

  $('toggleNotesBtn').addEventListener('click', e => {
    state.showNotes = !state.showNotes;
    e.currentTarget.classList.toggle('active', state.showNotes);
    $('sentencesList').classList.toggle('hide-notes', !state.showNotes);
  });

  $('fontSizeBtn').addEventListener('click', () => {
    state.fontScaleIndex = (state.fontScaleIndex + 1) % fontScales.length;
    const scale = fontScales[state.fontScaleIndex];
    document.documentElement.style.setProperty('--poem-size', scale.poem);
    document.documentElement.style.setProperty('--rt-size', scale.rt);
  });

  $('themeBtn').addEventListener('click', e => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      e.currentTarget.textContent = '🌙 護眼';
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      e.currentTarget.textContent = '☀️ 宣紙';
    }
  });

  $('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  document.addEventListener('fullscreenchange', () => {
    const wrapper = $('appWrapper');
    const btn = $('fullscreenBtn');
    if (document.fullscreenElement) {
      wrapper.classList.add('fullscreen');
      btn.textContent = '⛶ 縮小';
    } else {
      wrapper.classList.remove('fullscreen');
      btn.textContent = '⛶ 全螢幕';
    }
  });

  // 自訂詩詞對話框
  const customDialog = $('customPoemDialog');
  $('addPoemBtn').addEventListener('click', () => {
    customDialog.showModal();
  });

  $('cancelDialogBtn').addEventListener('click', () => {
    customDialog.close();
  });

  $('customPoemForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('customTitle').value.trim();
    const author = $('customAuthor').value.trim() || '自訂詩詞';
    const rawContent = $('customContent').value.trim();
    if (!title || !rawContent) return;

    const rawLines = rawContent
      .split(/\r?\n|(?<=[。！？；])/)
      .map(s => s.trim())
      .filter(Boolean);

    const newPoem = {
      id: 'custom_' + Date.now(),
      title,
      author,
      poet: author.replace(/〔.*〕/, '') || '自訂詩人',
      category: 'custom',
      genre: '自訂詩詞',
      ttsHeader: `${title}，${author}。`,
      intro: '使用者自訂詩詞，已自動標註注音並支援逐句朗讀。',
      lines: rawLines.map(line => ({
        text: line,
        tts: line,
        ruby: annotateTextToRuby(line),
        trans: '',
        vocab: ''
      }))
    };

    POEMS.push(newPoem);
    selectCategory('custom', POEMS.length - 1);
    $('customPoemForm').reset();
    customDialog.close();
  });

  // 鍵盤快捷鍵支援
  document.addEventListener('keydown', e => {
    if (customDialog.open || catalogDialog.open || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      $('nextBtn').click();
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      $('prevBtn').click();
    } else if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      $('repeatOneBtn').click();
    }
  });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }

  // 初始化畫面（預設載入第一首：曹操〈短歌行〉）
  renderAuthorSelectors();
  renderPoemSelect();
  renderPoem();
</script>
</body>
</html>
