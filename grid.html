<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x4 Grid Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 95vw;
            height: 95vh;
        }
        .grid-item {
            background-color: #ffffff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 24px;
            color: #666;
            position: relative;
        }
        .editable-cell {
            flex-direction: column;
            gap: 10px;
        }
        .edit-input {
            width: 80%;
            padding: 5px;
            font-size: 14px;
            text-align: center;
        }
        .edit-btn {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .edit-btn:hover {
            background-color: #45a049;
        }
        .clear-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            color: #d9534f;
        }
        .clear-btn:hover {
            background-color: #f2dede;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: background-color 0.3s;
        }
        #fullscreen-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <!-- 格子容器 -->
    <div class="grid-container" id="grid-container">
        <!-- 20個格子將由 JavaScript 動態產生 -->
    </div>

    <!-- 全螢幕按鈕 -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()">全螢幕</button>

    <script>
        // 載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var players = [];

        // API 載入完成後觸發
        function onYouTubeIframeAPIReady() {
            // 此處保留空白即可，我們會在 renderVideo 中動態初始化每個播放器
        }

        // 偵測播放器狀態改變 (當某一個影片開始播放時，暫停其他所有影片)
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                var currentPlayer = event.target;
                players.forEach(function(player) {
                    if (player !== currentPlayer && typeof player.pauseVideo === 'function') {
                        player.pauseVideo();
                    }
                });
            }
        }

        // 全螢幕切換功能
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 從網址萃取 YouTube 影片 ID
        function extractVideoID(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // 儲存並更新格子內的影片
        function saveVideoLink(cellId) {
            var input = document.getElementById('video-input-' + cellId);
            var url = input.value.trim();
            var videoId = extractVideoID(url);
            if (videoId) {
                localStorage.setItem('grid_video_' + cellId, videoId);
                renderVideo(cellId, videoId);
            } else {
                alert('請輸入有效的 YouTube 網址！');
            }
        }

        // 渲染影片到指定的格子中
        function renderVideo(cellId, videoId) {
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.remove('editable-cell');
            cell.innerHTML = `
                <iframe id="player${cellId}" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <button class="clear-btn" onclick="clearVideoLink(${cellId})">清除</button>
            `;
            
            // 若 YouTube API 已載入，立刻初始化該播放器
            if (typeof YT !== 'undefined' && YT.Player) {
                var iframe = document.getElementById('player' + cellId);
                var newPlayer = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                players.push(newPlayer);
            }
        }

        // 清除格子的影片記憶，變回輸入框
        function clearVideoLink(cellId) {
            localStorage.removeItem('grid_video_' + cellId);
            
            // 從陣列中移除被刪除的播放器，避免發生報錯
            players = players.filter(function(p) {
                return p.getIframe && p.getIframe().id !== ('player' + cellId);
            });
            
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.add('editable-cell');
            cell.innerHTML = `
                <input type="text" id="video-input-${cellId}" class="edit-input" placeholder="貼上 YouTube 網址 (第 ${cellId} 格)">
                <button class="edit-btn" onclick="saveVideoLink(${cellId})">儲存影片</button>
            `;
        }

        // 畫面載入時：初始化 20 個格子
        function initGrid() {
            var container = document.getElementById('grid-container');
            container.innerHTML = '';

            for (let i = 1; i <= 20; i++) {
                var cell = document.createElement('div');
                cell.className = 'grid-item editable-cell';
                cell.id = 'cell-' + i;
                
                // 預設為輸入框狀態
                cell.innerHTML = `
                    <input type="text" id="video-input-${i}" class="edit-input" placeholder="貼上 YouTube 網址 (第 ${i} 格)">
                    <button class="edit-btn" onclick="saveVideoLink(${i})">儲存影片</button>
                `;
                container.appendChild(cell);

                // 如果有先前儲存的影片，直接渲染出來
                var savedVideo = localStorage.getItem('grid_video_' + i);
                if (savedVideo) {
                    renderVideo(i, savedVideo);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 首次使用動態版本時，自動將前三格影片存入 localStorage，保留使用者的體驗
            if (!localStorage.getItem('grid_initialized_v2')) {
                localStorage.setItem('grid_video_1', extractVideoID("https://youtu.be/tlnNDNrIyBo"));
                localStorage.setItem('grid_video_2', extractVideoID("https://youtu.be/zPeMFCDPgKE"));
                localStorage.setItem('grid_video_3', extractVideoID("https://youtu.be/aRRQ6FQJZ-o"));
                localStorage.setItem('grid_initialized_v2', 'true');
            }
            
            // 執行初始化
            initGrid();
        });
    </script>
</body>
</html>
