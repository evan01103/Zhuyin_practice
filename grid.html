<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x4 Grid Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 95vw;
            height: 95vh;
        }
        .grid-item {
            background-color: #ffffff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 24px;
            color: #666;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- 1st cell -->
        <div class="grid-item">
            <iframe id="player1" src="https://www.youtube.com/embed/tlnNDNrIyBo?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- 2nd cell -->
        <div class="grid-item">
            <iframe id="player2" src="https://www.youtube.com/embed/zPeMFCDPgKE?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- 3rd cell -->
        <div class="grid-item">
            <iframe id="player3" src="https://www.youtube.com/embed/aRRQ6FQJZ-o?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- Remaining 17 cells -->
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
        <div class="grid-item">9</div>
        <div class="grid-item">10</div>
        <div class="grid-item">11</div>
        <div class="grid-item">12</div>
        <div class="grid-item">13</div>
        <div class="grid-item">14</div>
        <div class="grid-item">15</div>
        <div class="grid-item">16</div>
        <div class="grid-item">17</div>
        <div class="grid-item">18</div>
        <div class="grid-item">19</div>
        <div class="grid-item">20</div>
    </div>

    <script>
        // 非同步載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var players = [];

        // 當 API 下載完成後會自動執行此函式
        function onYouTubeIframeAPIReady() {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                var player = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                players.push(player);
            });
        }

        // 偵測播放器狀態改變，當某一個影片開始播放時，暫停其他所有影片
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                var currentPlayer = event.target;
                players.forEach(function(player) {
                    if (player !== currentPlayer && typeof player.pauseVideo === 'function') {
                        player.pauseVideo();
                    }
                });
            }
        }
    </script>
</body>
</html>
