<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x4 Grid Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 95vw;
            height: 95vh;
        }
        .grid-item {
            background-color: #ffffff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 24px;
            color: #666;
            position: relative;
        }
        .editable-cell {
            flex-direction: column;
            gap: 10px;
        }
        .edit-input {
            width: 80%;
            padding: 5px;
            font-size: 14px;
        }
        .edit-btn {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .clear-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 5px;
            font-size: 12px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: background-color 0.3s;
        }
        #fullscreen-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- 1st cell -->
        <div class="grid-item">
            <iframe id="player1" src="https://www.youtube.com/embed/tlnNDNrIyBo?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- 2nd cell -->
        <div class="grid-item">
            <iframe id="player2" src="https://www.youtube.com/embed/zPeMFCDPgKE?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- 3rd cell -->
        <div class="grid-item">
            <iframe id="player3" src="https://www.youtube.com/embed/aRRQ6FQJZ-o?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <!-- Remaining 17 cells -->
        <!-- 4th cell -->
        <div class="grid-item editable-cell" id="cell-4">
            <input type="text" id="video-input-4" class="edit-input" placeholder="貼上 YouTube 網址">
            <button class="edit-btn" onclick="saveVideoLink(4)">儲存影片</button>
        </div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
        <div class="grid-item">9</div>
        <div class="grid-item">10</div>
        <div class="grid-item">11</div>
        <div class="grid-item">12</div>
        <div class="grid-item">13</div>
        <div class="grid-item">14</div>
        <div class="grid-item">15</div>
        <div class="grid-item">16</div>
        <div class="grid-item">17</div>
        <div class="grid-item">18</div>
        <div class="grid-item">19</div>
        <div class="grid-item">20</div>
    </div>

    <script>
        // 非同步載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var players = [];

        // 當 API 下載完成後會自動執行此函式
        function onYouTubeIframeAPIReady() {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                var player = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                players.push(player);
            });
        }

        // 偵測播放器狀態改變，當某一個影片開始播放時，暫停其他所有影片
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                var currentPlayer = event.target;
                players.forEach(function(player) {
                    if (player !== currentPlayer && typeof player.pauseVideo === 'function') {
                        player.pauseVideo();
                    }
                });
            }
        }
        // 全螢幕切換功能
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        // 取得 YouTube 影片 ID
        function extractVideoID(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // 儲存影片連結
        function saveVideoLink(cellId) {
            var input = document.getElementById('video-input-' + cellId);
            var url = input.value.trim();
            var videoId = extractVideoID(url);
            if (videoId) {
                localStorage.setItem('grid_video_' + cellId, videoId);
                renderVideo(cellId, videoId);
            } else {
                alert('請輸入有效的 YouTube 網址！');
            }
        }

        // 渲染影片到格子中
        function renderVideo(cellId, videoId) {
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.remove('editable-cell');
            cell.innerHTML = `
                <iframe id="player${cellId}" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <button class="clear-btn" onclick="clearVideoLink(${cellId})">清除</button>
            `;
            // 如果 YouTube API 已經載入，手動初始化新播放器
            if (typeof YT !== 'undefined' && YT.Player) {
                var iframe = document.getElementById('player' + cellId);
                var newPlayer = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                // 為了避免重複，若先前有儲存過這個 player 也要替換或過濾掉，但簡單點就直接 push
                players.push(newPlayer);
            }
        }

        // 清除影片
        function clearVideoLink(cellId) {
            localStorage.removeItem('grid_video_' + cellId);
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.add('editable-cell');
            cell.innerHTML = `
                <input type="text" id="video-input-${cellId}" class="edit-input" placeholder="貼上 YouTube 網址">
                <button class="edit-btn" onclick="saveVideoLink(${cellId})">儲存影片</button>
            `;
        }

        // 網頁載入時檢查是否已有儲存的影片
        document.addEventListener('DOMContentLoaded', function() {
            var savedVideo4 = localStorage.getItem('grid_video_4');
            if (savedVideo4) {
                renderVideo(4, savedVideo4);
            }
        });
    </script>

    <!-- 全螢幕按鈕 -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()">全螢幕</button>
</body>
</html>
