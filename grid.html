<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x4 Grid Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .tabs-container {
            width: 95vw;
            display: flex;
            gap: 5px;
            margin-top: 2vh;
            margin-bottom: 10px;
            overflow-x: auto;
        }
        .tab {
            padding: 8px 15px;
            background-color: #ddd;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            font-size: 14px;
            color: #444;
            transition: background-color 0.2s;
        }
        .tab:hover {
            background-color: #ccc;
        }
        .tab.active {
            background-color: #ffffff;
            font-weight: bold;
            color: #000;
            border-top: 3px solid #007bff;
        }
        .tab-add {
            font-weight: bold;
            color: #007bff;
            padding: 8px 12px;
        }
        .tab-close {
            color: #999;
            font-size: 16px;
            line-height: 1;
        }
        .tab-close:hover {
            color: #d9534f;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 95vw;
            flex-grow: 1;
            margin-bottom: 2vh;
        }
        .grid-item {
            background-color: #ffffff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-size: 24px;
            color: #666;
            position: relative;
        }
        .editable-cell {
            flex-direction: column;
            gap: 10px;
        }
        .edit-input {
            width: 80%;
            padding: 5px;
            font-size: 14px;
            text-align: center;
        }
        .edit-btn {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .edit-btn:hover {
            background-color: #45a049;
        }
        .clear-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            color: #d9534f;
        }
        .clear-btn:hover {
            background-color: #f2dede;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: background-color 0.3s;
        }
        #fullscreen-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <!-- 分頁導覽列 -->
    <div class="tabs-container" id="tabs-container"></div>

    <!-- 格子容器 -->
    <div class="grid-container" id="grid-container"></div>

    <!-- 全螢幕按鈕 -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()">全螢幕</button>

    <script>
        let appData = {
            pages: [],
            currentPageId: null
        };
        var players = [];

        // 載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                if (!iframe.classList.contains('yt-initialized')) {
                    var player = new YT.Player(iframe, {
                        events: {
                            'onStateChange': onPlayerStateChange
                        }
                    });
                    players.push(player);
                    iframe.classList.add('yt-initialized');
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                var currentPlayer = event.target;
                players.forEach(function(player) {
                    if (player !== currentPlayer && typeof player.pauseVideo === 'function') {
                        player.pauseVideo();
                    }
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function extractVideoID(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        // --- 核心資料存取邏輯 ---
        function loadData() {
            let dataStr = localStorage.getItem('grid_pages_data');
            if (dataStr) {
                appData = JSON.parse(dataStr);
            } else {
                // 資料移轉：將舊版的 localStorage grid_video_X 轉移到新架構
                let oldDataExists = false;
                let defaultPage = { id: 'page_' + Date.now(), name: '分頁 1', videos: {} };
                
                for(let i=1; i<=20; i++) {
                    let oldVid = localStorage.getItem('grid_video_' + i);
                    if (oldVid) {
                        defaultPage.videos[i] = oldVid;
                        oldDataExists = true;
                    }
                }
                
                // 如果是全新使用者，給予預設的三部影片
                if (!oldDataExists && !localStorage.getItem('grid_initialized_v2')) {
                    defaultPage.videos[1] = extractVideoID("https://youtu.be/tlnNDNrIyBo");
                    defaultPage.videos[2] = extractVideoID("https://youtu.be/zPeMFCDPgKE");
                    defaultPage.videos[3] = extractVideoID("https://youtu.be/aRRQ6FQJZ-o");
                }
                
                appData.pages.push(defaultPage);
                appData.currentPageId = defaultPage.id;
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('grid_pages_data', JSON.stringify(appData));
        }

        // --- 分頁 UI 邏輯 ---
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            appData.pages.forEach(page => {
                let tab = document.createElement('div');
                tab.className = 'tab' + (page.id === appData.currentPageId ? ' active' : '');
                
                let titleSpan = document.createElement('span');
                titleSpan.textContent = page.name;
                titleSpan.title = "點擊兩下來重新命名";
                
                // 切換與重新命名事件
                titleSpan.onclick = () => switchPage(page.id);
                titleSpan.ondblclick = (e) => {
                    e.stopPropagation();
                    renamePage(page.id);
                };
                
                tab.appendChild(titleSpan);
                
                // 刪除按鈕 (大於 1 頁時才顯示)
                if (appData.pages.length > 1) {
                    let closeBtn = document.createElement('span');
                    closeBtn.className = 'tab-close';
                    closeBtn.textContent = '×';
                    closeBtn.title = "刪除分頁";
                    closeBtn.onclick = (e) => {
                        e.stopPropagation();
                        deletePage(page.id);
                    };
                    tab.appendChild(closeBtn);
                }
                
                container.appendChild(tab);
            });
            
            let addBtn = document.createElement('div');
            addBtn.className = 'tab tab-add';
            addBtn.textContent = '+';
            addBtn.title = "新增分頁";
            addBtn.onclick = addPage;
            container.appendChild(addBtn);
        }

        function switchPage(pageId) {
            if (appData.currentPageId === pageId) return;
            appData.currentPageId = pageId;
            saveData();
            renderTabs();
            initGrid();
        }

        function renamePage(pageId) {
            let page = appData.pages.find(p => p.id === pageId);
            let newName = prompt('請輸入新的分頁名稱：', page.name);
            if (newName && newName.trim() !== '') {
                page.name = newName.trim();
                saveData();
                renderTabs();
            }
        }

        function addPage() {
            let newPage = {
                id: 'page_' + Date.now(),
                name: '新分頁',
                videos: {}
            };
            appData.pages.push(newPage);
            appData.currentPageId = newPage.id;
            saveData();
            renderTabs();
            initGrid();
        }

        function deletePage(pageId) {
            if (confirm('確定要刪除這個分頁以及裡面的所有影片嗎？')) {
                appData.pages = appData.pages.filter(p => p.id !== pageId);
                if (appData.currentPageId === pageId) {
                    appData.currentPageId = appData.pages[0].id;
                }
                saveData();
                renderTabs();
                initGrid();
            }
        }

        // --- 網格與影片邏輯 ---
        function initGrid() {
            // 切換分頁時，銷毀或清空原有的播放器實例，避免背景繼續發出聲音
            players.forEach(p => { 
                if(typeof p.destroy === 'function') p.destroy(); 
            });
            players = [];
            
            var container = document.getElementById('grid-container');
            container.innerHTML = '';
            
            let currentPage = appData.pages.find(p => p.id === appData.currentPageId);

            for (let i = 1; i <= 20; i++) {
                var cell = document.createElement('div');
                cell.className = 'grid-item editable-cell';
                cell.id = 'cell-' + i;
                
                cell.innerHTML = `
                    <input type="text" id="video-input-${i}" class="edit-input" placeholder="貼上 YouTube 網址">
                    <button class="edit-btn" onclick="saveVideoLink(${i})">儲存影片</button>
                `;
                container.appendChild(cell);

                if (currentPage.videos && currentPage.videos[i]) {
                    renderVideo(i, currentPage.videos[i]);
                }
            }
            
            // 若 YouTube API 已載入，為新分頁的影片註冊播放器
            if (typeof YT !== 'undefined' && YT.Player) {
                setTimeout(onYouTubeIframeAPIReady, 100); 
                // 稍微延遲讓 iframe 進入 DOM 確保能被選取到
            }
        }

        function saveVideoLink(cellId) {
            var input = document.getElementById('video-input-' + cellId);
            var url = input.value.trim();
            var videoId = extractVideoID(url);
            if (videoId) {
                let currentPage = appData.pages.find(p => p.id === appData.currentPageId);
                if (!currentPage.videos) currentPage.videos = {};
                currentPage.videos[cellId] = videoId;
                saveData();
                renderVideo(cellId, videoId);
            } else {
                alert('請輸入有效的 YouTube 網址！');
            }
        }

        function renderVideo(cellId, videoId) {
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.remove('editable-cell');
            cell.innerHTML = `
                <iframe id="player${cellId}" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <button class="clear-btn" onclick="clearVideoLink(${cellId})">清除</button>
            `;
            
            if (typeof YT !== 'undefined' && YT.Player) {
                var iframe = document.getElementById('player' + cellId);
                var newPlayer = new YT.Player(iframe, {
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
                players.push(newPlayer);
                iframe.classList.add('yt-initialized');
            }
        }

        function clearVideoLink(cellId) {
            let currentPage = appData.pages.find(p => p.id === appData.currentPageId);
            if (currentPage.videos && currentPage.videos[cellId]) {
                delete currentPage.videos[cellId];
                saveData();
            }
            
            players = players.filter(function(p) {
                return p.getIframe && p.getIframe().id !== ('player' + cellId);
            });
            
            var cell = document.getElementById('cell-' + cellId);
            cell.classList.add('editable-cell');
            cell.innerHTML = `
                <input type="text" id="video-input-${cellId}" class="edit-input" placeholder="貼上 YouTube 網址">
                <button class="edit-btn" onclick="saveVideoLink(${cellId})">儲存影片</button>
            `;
        }

        // 啟動應用程式
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderTabs();
            initGrid();
        });
    </script>
</body>
</html>
